name: Nexagent Windows installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified installer to Nexagent releases
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:client
      - name: Lifecycle regression tests
        run: >
          node node_modules/tsx/dist/cli.mjs --tsconfig server/tsconfig.json --test
          server/modules/side-chats/tests/side-chats.test.ts
          server/modules/message-queue/tests/message-queue.test.ts
          server/modules/providers/tests/claude-fork-boundary.test.ts
          server/modules/providers/tests/provider-runtime.service.test.ts
          server/modules/monitors/tests/monitors.test.ts
          server/modules/monitors/tests/calendar.test.ts
          server/modules/monitors/tests/monitor-recovery-compat.test.ts
          server/modules/workspace-sections/tests/workspace-sections.test.ts
          server/modules/session-bridge/tests/session-bridge.test.ts
          server/modules/dot/tests/dot.test.ts
          server/modules/auth/tests/private-identity.test.ts
      - run: node --test electron/tests/workbench-profile.test.mjs
      - run: npm run build
      - run: node scripts/release/prepare-workbench.mjs
      - name: Create independent installer
        run: node node_modules/electron-builder/cli.js --projectDir .desktop-build/workbench --win nsis --x64 --publish never
      - name: Install into a disposable location
        shell: pwsh
        run: |
          $profile = Get-Content workbench-profile.json -Raw | ConvertFrom-Json
          $installer = (Resolve-Path "release/workbench/Nexagent-$($profile.version)-win-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'workbench-installed'
          $installProcess = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$installDir" -WindowStyle Hidden -PassThru -Wait
          if ($installProcess.ExitCode -ne 0) { throw "Installer exited $($installProcess.ExitCode)" }
          node scripts/release/smoke-installed-workbench.mjs $installDir release/workbench/installer-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed application acceptance failed' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  $([IO.Path]::GetFileName($installer))" | Set-Content release/workbench/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: claudex-windows
          path: |
            release/workbench/*.exe
            release/workbench/SHA256SUMS.txt
            release/workbench/installer-smoke.json
          if-no-files-found: error
      - name: Publish verified release
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $profile = Get-Content workbench-profile.json -Raw | ConvertFrom-Json
          $tag = "v$($profile.version)"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; bump the Workbench profile version instead of replacing it.' }
          gh release create $tag "release/workbench/Nexagent-$($profile.version)-win-x64.exe" release/workbench/SHA256SUMS.txt release/workbench/installer-smoke.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "$($profile.productName) $($profile.version)" --notes-file docs/WORKBENCH-WINDOWS.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
