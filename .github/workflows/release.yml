name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag to inspect
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

jobs:
  inspect-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Verify draft status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,assets > draft.json
          node -e "const r=require('./draft.json'); if(!r.isDraft) throw Error('Expected draft'); console.log(JSON.stringify(r,null,2))"
