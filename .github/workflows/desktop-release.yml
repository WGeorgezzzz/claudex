name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag (must match the package version)
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            target: --win nsis --x64
          - os: macos-14
            platform: mac
            target: --mac dmg --arm64
          - os: ubuntu-latest
            platform: linux
            target: --linux dir --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - run: npm ci --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/release/prepare-workbench.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build self-contained installer
        run: node node_modules/electron-builder/cli.js --projectDir .desktop-build/workbench ${{ matrix.target }} --publish never
      - name: Archive Linux desktop
        if: runner.os == 'Linux'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          tar -I 'gzip -1' -cf "release/workbench/Drover-$VERSION-linux-x64.tar.gz" -C release/workbench linux-unpacked
      - name: Install and verify Windows first run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = (Resolve-Path "release/workbench/Drover-$version-win-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'nexagent-installed'
          $process = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          npm install --prefix "$env:RUNNER_TEMP/browser-tools" --no-save --no-audit --no-fund playwright
          if ($LASTEXITCODE -ne 0) { throw 'Browser tooling install failed' }
          $env:NEXAGENT_PLAYWRIGHT_MODULE = "$env:RUNNER_TEMP/browser-tools/node_modules/playwright/index.mjs"
          node scripts/release/smoke-installed-workbench.mjs $installDir release/workbench/installer-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed application acceptance failed' }
      - name: Verify npm archive installation
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/prepare-npm.mjs
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/npm-pack.json"
          node scripts/release/smoke-npm.mjs "$RUNNER_TEMP/npm-pack.json"
      - name: Stage release files
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p release-assets
          find release/workbench -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.tar.gz' -o -name 'installer-smoke.json' -o -name 'npm-smoke.json' \) -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -print -quit)"
          cp .desktop-build/workbench/build-provenance.json "release-assets/provenance-$PLATFORM.json"
      - uses: actions/upload-artifact@v4
        with:
          name: nexagent-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: installer-first-run-evidence
          path: release/workbench/acceptance/
          if-no-files-found: warn

  draft:
    name: Upload to draft only
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nexagent-*
          path: release-assets
          merge-multiple: true
      - name: Verify and upload draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd release-assets
          sha256sum Drover-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          cd ..
          node scripts/release/draft-release.mjs "$RELEASE_TAG"
