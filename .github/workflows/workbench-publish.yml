name: Publish verified Workbench installer

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Workbench Windows installer run to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve the verified source revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ["RUN_ID"]
          assert re.fullmatch(r"\d+", run_id), "Expected a numeric run ID"
          run = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"
          ]))
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert run["event"] == "workflow_dispatch"
          assert run["path"].split("@")[0] == ".github/workflows/workbench-windows.yml"
          assert re.fullmatch(r"[a-f0-9]{40}", run["head_sha"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={run['head_sha']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: cloudcli-workbench-windows
          path: .verification/release-artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify installer checksum and acceptance receipt
        id: artifact
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          profile = json.loads(pathlib.Path("workbench-profile.json").read_text())
          version = profile["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version)
          directory = pathlib.Path(".verification/release-artifact").resolve()
          name = f"AgentHub-Workbench-{version}-win-x64.exe"
          checksum, recorded_name = (directory / "SHA256SUMS.txt").read_text().strip().split(maxsplit=1)
          assert recorded_name == name and re.fullmatch(r"[a-f0-9]{64}", checksum)
          installer = directory / name
          digest = hashlib.sha256()
          with installer.open("rb") as source:
              for chunk in iter(lambda: source.read(1024 * 1024), b""):
                  digest.update(chunk)
          assert digest.hexdigest() == checksum
          receipt = json.loads((directory / "installer-smoke.json").read_text())
          assert receipt["passed"] and receipt["portIsolated"] and receipt["identityMatched"]
          assert receipt["existingDatabaseUnchanged"] and receipt["unrelatedServerRequests"] == 0
          assert receipt["authenticatedApi"] == 200 and receipt["unauthenticatedQueue"] == 401
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nname={name}\n")
          PY
      - name: Publish without replacing an earlier release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
          INSTALLER_NAME: ${{ steps.artifact.outputs.name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          tag="workbench-v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace verified artifacts."
            exit 1
          fi
          gh release create "$tag" \
            ".verification/release-artifact/$INSTALLER_NAME" \
            .verification/release-artifact/SHA256SUMS.txt \
            .verification/release-artifact/installer-smoke.json \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "AgentHub $VERSION" --notes-file docs/WORKBENCH-WINDOWS.md
